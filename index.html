<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container text-center">
        <!-- 時間設定 -->
        <div class="mb-2">
            <select id="hours" class="form-select mb-2"></select> <span>h</span>
            <select id="minutes" class="form-select mb-2"></select> <span>m</span>
            <select id="seconds" class="form-select mb-2"></select> <span>s</span>
        </div>

        <!-- 音楽選択（表示は大文字始まり、valueはファイル名と一致させる） -->
        <select id="music" class="form-select">
            <option value="mountain">Mountain</option>
            <option value="fire">Fire</option>
            <option value="sea">Sea</option>
            <option value="none">None</option>
        </select>

        <!-- タイマー開始ボタン -->
        <button id="btn btn-primary">START TIMER</button>
    </div>

    <!-- 暗転用オーバーレイ -->
    <div id="overlay" class="hidden">
        <p id="focus-text">STAY FOCUSED.</p>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
